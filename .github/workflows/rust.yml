name: Rust
on:
  push:
    branches: ["**"]
  pull_request:

# Build and test only: the token needs nothing beyond reading the repo.
permissions:
  contents: read

jobs:
  iap2-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/vendor/iap2-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/vendor/iap2-core
      # Upstream is not rustfmt-formatted; report only, do not gate on it.
      - run: cargo fmt --check
        continue-on-error: true
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
        continue-on-error: true

  workspace-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p iap2d -p ocbm-host
