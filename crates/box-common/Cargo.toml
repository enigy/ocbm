[package]
name = "box-common"
version = "0.1.0"
edition = "2021"
license = "Unlicense"

# The box-side foundation the CarPlay daemons (ocbmd, carplayd, btd) share.
#
#   box-common
#   ├── ocbm      — OCBM framing/channels (re-exports ocbm-proto)
#   ├── flags     — projection ownership + session flags
#   ├── net       — the adapter's network constants
#   └── timeline  — the connect timeline's clock, marks and line

[dependencies]
ocbm-proto = { path = "../ocbm-proto" }
# clock_gettime(CLOCK_BOOTTIME) for the timeline's clock; every daemon above links it already.
libc = "0.2"
