[package]
name = "ocbm-link"
version = "0.1.0"
edition = "2021"
description = "OCBW v1: OCBM over TCP behind a pre-shared-key handshake and ChaCha20-Poly1305 records (the Wi-Fi link)"
license = "Unlicense"

[lib]
path = "src/lib.rs"

# All four are in Cargo.lock already (carplayd's receiver, pairing and rtsp crates link them), so the
# workspace builds offline and the box binaries share one copy of each.
[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
# `compress`: the set-up code's SHA-256 through the compression function HMAC links anyway (lib.rs `code_digest`).
sha2 = { version = "0.10", features = ["compress"] }
# OCBS v1, the set-up exchange (M3): P-256 ECDH, which the Android head unit has in its platform at API 32.
p256 = { version = "0.13", default-features = false, features = ["ecdh"] }
