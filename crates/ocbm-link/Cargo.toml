[package]
name = "ocbm-link"
version = "0.1.0"
edition = "2021"
description = "OCBM over TCP: a pre-shared-key handshake and ChaCha20-Poly1305 records around the OCBM byte stream"
license = "Unlicense"

[lib]
path = "src/lib.rs"

[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
