[package]
name = "bt-common"
version = "0.1.0"
edition = "2021"
description = "Bluetooth primitives for btd's wireless CarPlay: raw HCI scan enable, kernel RFCOMM, a bluetoothd-less SDP server, and the pairing agent."

# Extracted 2026-09-01 from crates/vendor/wireless (btd), which had these as private modules of a
# binary. sdp_client.rs and bt_bringup.rs stayed in btd (they browse for the iAP2 service and
# sequence the CarPlay bring-up), as did the CarPlay session logic.
#
# The `CARPLAY_*` environment variable names inside these modules are retained on purpose. They are
# the deployed contract on a shipping box; renaming them would be a behaviour change dressed up as a
# refactor.

[dependencies]
libc = "0.2"
