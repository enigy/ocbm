[workspace]
resolver = "2"
members = ["crates/ocbm-proto", "crates/box-common", "crates/bt-common", "ccpa/ocbmd", "ccpa/iap2d", "ccpa/carplayd", "ccpa/aa-wireless", "host/ocbm-host", "crates/vendor/wireless",
    # The remote MFi wire format, linked into btd and carplayd until phase C6 removes the remote path.
    "crates/mfi-wire",
]
# Vendored external crates (copied in 2026-07-13 to make the project self-contained): carplayd's
# receiver_core deps (from old/ncm_carplayd) + iap2d's carplay iAP2 core. Excluded from membership so
# `--workspace` builds them only as path DEPENDENCIES with the features the project requests
# (carplayd uses receiver default-features=false + ["mic-uplink-eld"], so the optional eld-codec /
# static libfdk-aac IS built into carplayd — needs FDK_AAC_PREFIX; a deliberate pending-decision
# flag point, see ccpa/carplayd/Cargo.toml).
exclude = [
    "crates/vendor/mfi", "crates/vendor/mfi-i2c-local", "crates/vendor/pairing", "crates/vendor/receiver",
    "crates/vendor/rtsp", "crates/vendor/eld-codec",
    "crates/vendor/iap2-core", "crates/vendor/metadata",
]

# Size-first profile for the box binary (armv7, ~12.5MB rootfs).
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true

# Speed-tune the hot paths (ChaCha20-Poly1305 runs on every 4K video + audio frame; ocbm-proto's
# Reassembler and receiver's A/V forwarding are on the same per-frame critical path). opt-level=2
# here — paired with target-cpu=cortex-a7 in .cargo/config.toml — recovers real throughput. Note
# this is SCALAR: the armv7 musl target spec carries an explicit `-neon` that the CPU target does
# not override, so no Rust code we ship is vectorized (see .cargo/config.toml for the measurement).
# The rest of the tree stays opt-level="z" (size-first). The size delta lands
# almost entirely in carplayd (the only binary carrying crypto + full A/V forwarding).
[profile.release.package.chacha20]
opt-level = 2
[profile.release.package.poly1305]
opt-level = 2
[profile.release.package.chacha20poly1305]
opt-level = 2
[profile.release.package.ocbm-proto]
opt-level = 2
[profile.release.package.receiver]
opt-level = 2
