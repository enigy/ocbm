# Cross-build tuning for the box binaries. `target-cpu=cortex-a7` tunes instruction scheduling to
# the real CPU (paired with the [profile.release.package.*] opt-level=2 overrides in the root
# Cargo.toml).
#
# NEON is OFF in every Rust binary we ship, and the CPU target does not turn it on. The
# armv7-unknown-linux-musleabihf spec carries an explicit `-neon`:
#
#   $ RUSTC_BOOTSTRAP=1 rustc -Zunstable-options --print target-spec-json \
#       --target armv7-unknown-linux-musleabihf | grep features
#   "features": "+v7,+vfp3d16,+thumb2,-neon"
#
# An explicit `-neon` in the spec beats the CPU's implied features, so `-C target-cpu=cortex-a7`
# emits no NEON at all — verified 2026-07-29 across all 64 .s files in carplayd's codegen graph
# (zero NEON instructions) and by A/B on the shipped binary (identical vld1/vst1 counts to a build
# with no rustflags at all; those come from the C side, which zig cc does vectorize).
#
# The board itself HAS NEON — /proc/cpuinfo on the box reports `neon vfpv3 vfpv4 vfpd32`. Enabling
# it needs `-C target-feature=+neon` (warns: unstable for target_arch="arm") or a custom target
# JSON. Measured cost of adding it: +2,096 bytes (+0.13%), ~3,400 memory ops vectorized. Measured
# benefit to CRYPTO specifically: one function — the keystream XOR. chacha20 0.9's NEON backend is
# gated on aarch64 and poly1305 0.8's only SIMD backend is x86 AVX2, so the quarter-round core and
# the MAC stay scalar either way. Measure before assuming a throughput win.
#
# Caveat if that changes: `cfg!(target_feature = "neon")` stays FALSE even when +neon is passed
# (unstable features emit no cfg), so any compile-time NEON dispatch here silently takes the
# scalar arm.
[target.armv7-unknown-linux-musleabihf]
rustflags = ["-C", "target-cpu=cortex-a7"]

