[package]
name = "ocbmd"
version = "0.1.0"
edition = "2021"
description = "Box-side OCBM daemon (armv7/musl): owns /dev/usb_accessory; CTRL/ECHO/CONSOLE/MFI channels"

[[bin]]
name = "ocbmd"
path = "src/main.rs"

[dependencies]
ocbm-proto = { path = "../../crates/ocbm-proto" }
box-common = { path = "../../crates/box-common" }
libc = "0.2"
# inflate for `ocbmd jffs2-extract` (src/jffs2.rs): the on-adapter restore decodes the stick's flash dump
# with no computer (Scott, 3 Nov). Pure Rust, no unsafe, no C.
miniz_oxide = "0.8"
# The Wi-Fi transport (src/wifi.rs): OCBM over TCP behind a pre-shared-key handshake and
# ChaCha20-Poly1305 records. Off unless /etc/ocbm/wifi_link holds a key.
ocbm-link = { path = "../../crates/ocbm-link" }
